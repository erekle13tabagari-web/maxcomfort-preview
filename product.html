<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>პროდუქტი · მაქს კომფორტი</title>
<meta name="description" content="">
<meta name="theme-color" content="#2B3179">
<link rel="icon" href="assets/brand/logo/mc-symbol-primary.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/MCSansGeorgian-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/fonts/MCSansGeorgian-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="assets/css/mc.css">
<script>try{var t=localStorage.getItem('mc.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="assets/js/config.js"></script>
<script type="module" src="assets/js/product.js"></script>
</head>
<body data-page="product">
<div id="mc-header"></div>

<main id="main">
  <div class="wrap">
    <div data-crumbs></div>
    <div class="pdp" data-pdp></div>
  </div>

  <div class="info">
    <div class="info__nav"><div class="wrap" role="tablist" aria-label="პროდუქტის ინფორმაცია" data-info-nav></div></div>
    <div class="wrap" data-blocks></div>
  </div>

  <section class="story" data-story hidden aria-labelledby="story-h">
    <div class="wrap">
      <div class="sec__head"><div><span class="eyebrow">ახლოდან</span><h2 class="h2" id="story-h" data-story-h></h2></div></div>
      <div data-story-rows></div>
      <div class="scenes" data-scenes></div>
    </div>
  </section>

  <section class="sec sec--cloud" data-related hidden aria-labelledby="rel-h">
    <div class="wrap">
      <div class="sec__head"><div><span class="eyebrow">ასევე ნახეთ</span><h2 class="h2" id="rel-h">მსგავსი პროდუქტები</h2></div></div>
      <div class="grid"></div>
    </div>
  </section>

  <section class="sec--tight" data-seen hidden aria-labelledby="seen-h">
    <div class="wrap" style="padding-block:clamp(28px,3.4vw,48px)">
      <div class="sec__head"><div><span class="eyebrow">თქვენთვის</span><h2 class="h2" id="seen-h">ბოლოს ნანახი</h2></div></div>
      <div class="grid"></div>
    </div>
  </section>
</main>

<div class="buybar" aria-hidden="true"><div class="wrap" data-bb></div></div>
<div id="mc-footer"></div>
</body>
</html>
